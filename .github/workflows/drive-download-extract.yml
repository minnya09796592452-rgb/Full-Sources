name: Download and extract Google Drive archive

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-archive-import
  cancel-in-progress: false

jobs:
  download-extract-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone repository (without third-party Actions)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/minnya09796592452-rgb/Full-Sources.git "$GITHUB_WORKSPACE/repo"
          cd "$GITHUB_WORKSPACE/repo"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/minnya09796592452-rgb/Full-Sources.git"

      - name: Install Google Drive downloader
        working-directory: repo
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/drive-venv"
          "$RUNNER_TEMP/drive-venv/bin/python" -m pip install --disable-pip-version-check gdown

      - name: Download archive from Google Drive
        working-directory: repo
        env:
          DRIVE_FILE_ID: 1pVtCrJFmfkX-lJswUeDhPgMg62wdZETZ
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/drive-venv/bin/gdown" "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "$RUNNER_TEMP/drive_archive"
          test -s "$RUNNER_TEMP/drive_archive"
          echo "Downloaded bytes: $(wc -c < "$RUNNER_TEMP/drive_archive")"

      - name: Safely extract archive
        working-directory: repo
        run: |
          "$RUNNER_TEMP/drive-venv/bin/python" - <<'PY'
          import hashlib
          import os
          import shutil
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "drive_archive"
          dest = Path("Outputs/Drive_Extracted")
          max_total = 1_000_000_000
          max_file = 95_000_000
          max_entries = 20_000

          def safe_target(name: str) -> Path:
              name = name.replace("\\", "/")
              p = PurePosixPath(name)
              if p.is_absolute() or not p.parts or any(part in ("", ".", "..") for part in p.parts):
                  raise ValueError(f"Unsafe archive path: {name!r}")
              if any(":" in part for part in p.parts):
                  raise ValueError(f"Unsupported archive path: {name!r}")
              target = dest.joinpath(*p.parts)
              if dest.resolve() not in target.resolve().parents and target.resolve() != dest.resolve():
                  raise ValueError(f"Path escapes output directory: {name!r}")
              return target

          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True)

          count = 0
          total = 0
          written = []

          def account(name: str, size: int):
              global count, total
              count += 1
              total += size
              if count > max_entries:
                  raise ValueError(f"Archive contains more than {max_entries} entries")
              if size > max_file:
                  raise ValueError(f"{name} is {size:,} bytes; GitHub's per-file limit requires files below 95 MB")
              if total > max_total:
                  raise ValueError("Extracted data exceeds the 1 GB safety limit for this repository workflow")

          if zipfile.is_zipfile(archive):
              with zipfile.ZipFile(archive) as zf:
                  for info in zf.infolist():
                      if info.is_dir():
                          safe_target(info.filename).mkdir(parents=True, exist_ok=True)
                          continue
                      mode = (info.external_attr >> 16) & 0o170000
                      if mode == 0o120000:
                          raise ValueError(f"Symbolic links are not allowed: {info.filename}")
                      target = safe_target(info.filename)
                      account(info.filename, info.file_size)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info, "r") as src, target.open("wb") as out:
                          shutil.copyfileobj(src, out)
                      written.append((info.filename, info.file_size))
          elif tarfile.is_tarfile(archive):
              with tarfile.open(archive, "r:*") as tf:
                  for member in tf.getmembers():
                      target = safe_target(member.name)
                      if member.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      if not member.isfile():
                          raise ValueError(f"Links and special files are not allowed: {member.name}")
                      account(member.name, member.size)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = tf.extractfile(member)
                      if src is None:
                          raise ValueError(f"Could not read archive entry: {member.name}")
                      with src, target.open("wb") as out:
                          shutil.copyfileobj(src, out)
                      written.append((member.name, member.size))
          else:
              raise ValueError("Unsupported archive format. Accepted formats: ZIP and TAR/TAR.GZ/TAR.BZ2/TAR.XZ.")

          if not written:
              raise ValueError("Archive extracted no files; refusing to commit an empty output.")

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          manifest = [
              "Google Drive archive extraction",
              "Drive file ID: 1pVtCrJFmfkX-lJswUeDhPgMg62wdZETZ",
              f"Archive SHA-256: {digest}",
              f"Extracted files: {len(written)}",
              f"Total extracted bytes: {total}",
              "",
              "Files:",
              *[f"{size}\t{name}" for name, size in written],
              "",
          ]
          (dest / "IMPORT_MANIFEST.txt").write_text("\n".join(manifest), encoding="utf-8")
          print(f"Extracted {len(written)} files ({total:,} bytes) into {dest}")
          PY

      - name: Commit extracted output to repository
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Outputs/Drive_Extracted
          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi
          git commit -m "Import extracted Google Drive archive"
          git push origin HEAD:main
